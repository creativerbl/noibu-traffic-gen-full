# A/B-test scenario (branch: ab-test)
#
# Five sessions per hour (~every 12 min). Each session adds 1-3 random
# products, opens the cart via header CART -> "View Cart", then checks which
# checkout button the cart page shows:
#   - sticky banner  (a[data-sticky-checkout-now-action])  -> click it and
#     complete the order with the test card from .env (CARD_*)
#   - primary button only (a[data-primary-checkout-now-action]) -> exit
#
# skip_nav_walk keeps the session focused on cart + checkout.
type: scripted
name: "ab-test"
weight: 100
skip_nav_walk: true
steps:
  - action: ab_test_checkout
    products_min: 1
    products_max: 3
